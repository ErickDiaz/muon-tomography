# Canonical parameters for the four target volcanoes of this project.
# Read by notebooks 04 / 05 / 07 to dispatch the muography pipeline per
# volcano without hardcoding cone/summit/density values inside each cell.
#
# Fields:
#   lat, lon          : summit coordinates (WGS84, decimal degrees) from the
#                       Smithsonian GVP VOTW database (queried 2026-10-14).
#                       Earlier GVP values (Fuego 14.473/-90.880, Pacaya
#                       14.380) fell 220-250 m from the DEM summit, on the
#                       upper flank; the current values sit within one DEM
#                       pixel or two of the summit.
#   summit_m          : GVP summit elevation (m a.s.l.). The simulation uses
#                       the DEM value at (lat, lon) via terrain.summit_elevation.
#   cone:
#     base_m          : elevation of the base of the synthetic cone
#                       (control case for NB 04 and the "cono" panel of
#                       NB 05's residual analysis). Picked to match the
#                       local valley floor.
#     base_radius_m   : horizontal radius of the synthetic cone at base.
#     density_gcc     : rock density used in ray tracing. We keep
#                       2.65 g/cc (standard rock per Groom 2001) for all
#                       four volcanoes for consistency with the
#                       simulation chain; petrological variations
#                       (basalt vs andesite) are second-order systematics
#                       captured in the Discussion of the paper.
#   default_station   : RSN station code used by default when notebooks
#                       are run without overriding STATION_NAME. Matches
#                       data/detector_sites.csv.

fuego:
  lat: 14.4748
  lon: -90.8806
  summit_m: 3799
  cone:
    base_m: 2500
    base_radius_m: 1500
    density_gcc: 2.65
  default_station: FG16

acatenango:
  lat: 14.501
  lon: -90.876
  summit_m: 3976
  cone:
    base_m: 2500
    base_radius_m: 1800
    density_gcc: 2.65
  default_station: FG16     # shared with Fuego; no RSN station dedicated to Acatenango

pacaya:
  lat: 14.382
  lon: -90.601
  summit_m: 2569
  cone:
    base_m: 1500
    base_radius_m: 1200
    density_gcc: 2.65
  default_station: PCG      # Cerro Chino — on the Pacaya flank, 1.6 km from crater

agua:
  lat: 14.465
  lon: -90.743
  summit_m: 3760
  cone:
    base_m: 1500
    base_radius_m: 2000
    density_gcc: 2.65
  default_station: SAOB     # San Juan del Obispo — only RSN station near Agua
