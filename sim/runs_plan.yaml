# Batch plan for multi-volcano CORSIKA simulations.
#
# Read by:
#   scripts/run_batch.py    (orchestrator, server-side, tmux session 'batch')
#   scripts/sim_status.py   (dashboard, terminal with `rich`)
#
# Run via `make batch-start` on the server. Each entry is dispatched as
# `make corsika-run VOLCAN=<v> DETECTOR_POS=<dp> NSHOW=<n>`, which assigns
# RUNNR sequentially and registers the run in sim/runs.csv.
#
# The orchestrator skips an entry if an equivalent run (same volcan + nshow
# + detector_pos) already exists in sim/runs.csv with status=ok.
#
# Fuego is included for dashboard completeness; it is already done as
# RUNNR 2901 and will be skipped by the orchestrator.

defaults:
  detector_pos: 1
  nshow: 1000000  

plan:
  - { volcan: fuego }
  - { volcan: acatenango }
  - { volcan: pacaya }
  - { volcan: agua }
